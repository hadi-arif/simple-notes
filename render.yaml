# Blueprint Render: membuat database, backend (Docker), dan frontend (situs statis) sekaligus.
# Cara pakai ada di DEPLOY.md.
databases:
  - name: notes-db
    databaseName: notes_db
    plan: free

services:
  - type: web
    name: notes-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # isi dengan alamat frontend setelah frontend terbit

  - type: web
    name: notes-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false # isi dengan alamat backend setelah backend terbit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
